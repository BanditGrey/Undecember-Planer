name: Sample pages
on: { workflow_dispatch: {}, push: { paths: ['.sample-pages'] } }
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample pages
        run: |
          mkdir -p sample
          for u in runes/LightningStrike runes/Multishot runes/SealOfDefense uniques/StarChasersBow uniques/Insight authority/WeaponsAlyssa authority/RingLeo runecast/RuneGrowthUnique essences/MagicUpgradeEssence coins/ potions/ materials/; do
            n=$(echo "$u" | tr '/' '_'); curl -sL "https://undecember.thein.ru/en/$u/" -o "sample/$n.html"; done
          ls -la sample
      - uses: actions/upload-artifact@v4
        with: { name: sample-pages, path: sample }
