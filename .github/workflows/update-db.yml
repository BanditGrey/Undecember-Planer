name: Update database
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  push:
    paths:
      - 'scripts/**'
      - '.db-refresh'      # touch this file to force a full refresh from any branch
permissions:
  contents: write
concurrency: update-db-${{ github.ref }}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Scrape undecember.thein.ru into db/ and public/icons/
        run: node scripts/scrape.mjs
      - run: node scripts/build-data.mjs
      - name: Commit database
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add db public/icons src/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(db): refresh database from source $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"
